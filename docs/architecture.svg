<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0%" stop-color="#0b1220"/><stop offset="100%" stop-color="#111827"/>
  </linearGradient>
  <linearGradient id="card" x1="0" x2="1">
    <stop offset="0%" stop-color="#182235"/><stop offset="100%" stop-color="#202c44"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".28"/>
  </filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
    <path d="M0,0 L10,3 L0,6 z" fill="#7dd3fc"/>
  </marker>
</defs>
<rect width="1200" height="520" rx="24" fill="url(#bg)"/>
<text x="600" y="42" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="700" fill="#f8fafc">Amazon Sales Intelligence &amp; Forecasting</text>
<text x="600" y="68" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#94a3b8">Data → Validation → Models → Analytics → API → Docker</text>

<g filter="url(#shadow)">
  <rect x="45" y="105" width="185" height="82" rx="16" fill="url(#card)" stroke="#334155"/>
  <text x="137" y="137" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Raw Sales Data</text>
  <text x="137" y="161" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#94a3b8">CSV + dimensions</text>

  <rect x="280" y="105" width="190" height="82" rx="16" fill="url(#card)" stroke="#334155"/>
  <text x="375" y="137" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Feature Pipeline</text>
  <text x="375" y="161" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#94a3b8">Leakage-free lags</text>

  <rect x="520" y="105" width="185" height="82" rx="16" fill="url(#card)" stroke="#334155"/>
  <text x="612" y="137" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Time-Series Split</text>
  <text x="612" y="161" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#94a3b8">Holdout + walk-forward</text>

  <rect x="755" y="105" width="185" height="82" rx="16" fill="url(#card)" stroke="#334155"/>
  <text x="847" y="137" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Model Bench</text>
  <text x="847" y="161" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#94a3b8">Naive · LR · LGBM · Prophet · MLP</text>

  <rect x="990" y="105" width="165" height="82" rx="16" fill="url(#card)" stroke="#334155"/>
  <text x="1072" y="137" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Results</text>
  <text x="1072" y="161" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#94a3b8">MAE · RMSE · MAPE · R²</text>
</g>

<g stroke="#7dd3fc" stroke-width="3" fill="none" marker-end="url(#arrow)">
  <line x1="230" y1="146" x2="278" y2="146"/>
  <line x1="470" y1="146" x2="518" y2="146"/>
  <line x1="705" y1="146" x2="753" y2="146"/>
  <line x1="940" y1="146" x2="988" y2="146"/>
</g>

<g filter="url(#shadow)">
  <rect x="95" y="270" width="275" height="120" rx="18" fill="url(#card)" stroke="#334155"/>
  <text x="232" y="304" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#f8fafc">📊 Streamlit</text>
  <text x="232" y="329" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#cbd5e1">4 interactive tabs</text>
  <text x="232" y="351" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#94a3b8">Overview · Sales · Customers · Forecasting</text>

  <rect x="462" y="270" width="275" height="120" rx="18" fill="url(#card)" stroke="#334155"/>
  <text x="600" y="304" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#f8fafc">⚡ Flask REST API</text>
  <text x="600" y="329" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#cbd5e1">/health · /model · /predict</text>
  <text x="600" y="351" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#94a3b8">Shared feature contract + lazy model loading</text>

  <rect x="829" y="270" width="275" height="120" rx="18" fill="url(#card)" stroke="#334155"/>
  <text x="966" y="304" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#f8fafc">🐳 Docker</text>
  <text x="966" y="329" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#cbd5e1">Reproducible runtime</text>
  <text x="966" y="351" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#94a3b8">API + dashboard deployment-ready</text>
</g>

<g stroke="#7dd3fc" stroke-width="3" fill="none" marker-end="url(#arrow)">
  <path d="M1072 187 C1072 225 966 230 966 268"/>
  <path d="M847 187 C847 225 600 230 600 268"/>
  <path d="M612 187 C612 225 232 230 232 268"/>
</g>

<text x="600" y="452" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#94a3b8">Deployment status: ready for cloud deployment; no cloud instance is claimed here as deployed.</text>
</svg>